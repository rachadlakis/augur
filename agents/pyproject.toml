## =============================================================================
## augur-agents — the ADK + A2A agent layer
##
## A uv workspace member of the repo root. One installable package,
## `augur_agents`, with a subpackage per agent:
##
##   augur_agents/orchestrator/   coordinates the lifecycle, keeps control
##   augur_agents/research/       advisory literature agent (read-only)
##   augur_agents/data/           dataset inspect / curate / manifest
##   augur_agents/training/       plan / estimate / launch / monitor
##   augur_agents/evaluation/     benchmark suites and comparison
##
## Run from the repo root:
##   uv run python -m augur_agents serve all      # the four worker A2A servers
##   uv run adk api_server --with_ui --port 8000 agents/augur_agents
## =============================================================================

[project]
name = "augur-agents"
version = "0.1.0"
description = "Augur Tensors agent layer: ADK agents behind the A2A protocol"
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    # ADK runs the agents and owns the A2A integration. `google.adk.a2a._compat`
    # is what lets us target a2a-sdk 1.x without hand-writing against its
    # rewritten types, so keep the [a2a] extra.
    "google-adk[a2a]>=2.8,<3",
    # Pinned to the 1.x line per the repo's target stack. ADK allows >=0.3.4,<2,
    # so this is inside its supported range.
    "a2a-sdk[http-server]>=1.1.0,<2",
    # Declared for the capability tool servers (dataset-mcp, training-mcp, ...)
    # that replace the in-process stubs. Not imported yet.
    "mcp>=1.29,<2",
    # One provider-agnostic path to the model; every agent goes through it.
    "litellm>=1.99",
    "pydantic>=2.11",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "nest-asyncio>=1.6",
    "click>=8.1",
    # Trading bot dependencies (from trading_bot_chatgpt.py)
    "alpaca-py>=0.44.0",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    # Crypto research and market data
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["augur_agents"]
include = [
    "/augur_agents/py.typed",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["F", "I"]


